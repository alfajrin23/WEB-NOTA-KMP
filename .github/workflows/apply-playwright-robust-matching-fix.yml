name: Apply Playwright robust matching fix

on:
  push:
    branches:
      - fix/playwright-kdkmp-duplicate-mapping-20260908
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playwright-kdkmp-duplicate-mapping-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source patch
        run: node scripts/apply-playwright-robust-matching-fix.mjs

      - name: Run focused regression tests
        run: |
          npx tsx --test tests/kdkmp-option-matching.test.mjs tests/playwright-robust-matching.test.mjs
          npm run test:belanja-sync

      - name: Build
        run: npm run build

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/belanja-runner/copy-reconcile.ts
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: harden KDKMP selection and duplicate transaction mapping"
          git push origin HEAD:fix/playwright-kdkmp-duplicate-mapping-20260908
