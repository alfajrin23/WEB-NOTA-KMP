name: Playwright door-lock audit 20260908

on:
  push:
    branches:
      - fix/playwright-door-lock-audit-20260908

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playwright-door-lock-audit-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply audited matching patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-playwright-door-lock-audit-20260908.mjs')
          s = p.read_text()
          s = s.replace('  const combined = `${name}${specification}`;', '  const combined = name + specification;')
          p.write_text(s)
          PY
          node scripts/patch-playwright-door-lock-audit-20260908.mjs
      - name: Door-lock regression
        run: npx tsx --test tests/iii05-door-lock-mapping.test.mjs
      - name: Belanja sync regression
        run: npm run test:belanja-sync
      - name: Robust Playwright matching regression
        run: npx tsx --test tests/playwright-robust-matching.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/belanja-runner/copy-reconcile.ts tests/iii05-door-lock-mapping.test.mjs package.json
          git commit -m "fix: harden Playwright item mapping and budget repair [patched]"
          git push origin HEAD:fix/playwright-door-lock-audit-20260908
